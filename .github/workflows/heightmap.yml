# One-off: fetch a real elevation grid around a point and print it, so a 3D terrain map can be built
# from an egress-locked environment. Read-only, no secrets. Source: opentopodata.org SRTM 30m.
name: Heightmap
on:
  workflow_dispatch:
    inputs:
      lat:   { description: 'Centre latitude',  type: string, default: '52.8500' }
      lon:   { description: 'Centre longitude', type: string, default: '-3.7600' }
      km:    { description: 'Half-size (km each way from centre)', type: string, default: '3' }
      n:     { description: 'Grid samples per side', type: string, default: '64' }
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch elevation grid
        run: |
          node <<'EOF'
          const LAT=+'${{ inputs.lat }}', LON=+'${{ inputs.lon }}', KM=+'${{ inputs.km }}', N=+'${{ inputs.n }}';
          const dLat = KM/111.19, dLon = KM/(111.32*Math.cos(LAT*Math.PI/180));
          const S=LAT-dLat, Nn=LAT+dLat, W=LON-dLon, E=LON+dLon;
          const lats=[], lons=[];
          for (let r=0;r<N;r++) for (let c=0;c<N;c++){ lats.push(Nn - (Nn-S)*r/(N-1)); lons.push(W + (E-W)*c/(N-1)); }
          const heights=new Array(lats.length).fill(null);
          const B=100, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function batch(i, dataset){
            const locs=[]; for (let k=i;k<Math.min(i+B,lats.length);k++) locs.push(lats[k].toFixed(6)+','+lons[k].toFixed(6));
            const url=`https://api.opentopodata.org/v1/${dataset}?locations=${locs.join('|')}`;
            const r=await fetch(url); const d=await r.json();
            if(d.status!=='OK'||!Array.isArray(d.results)) throw new Error(d.error||d.status||('HTTP '+r.status));
            d.results.forEach((x,k)=>{ heights[i+k]=x.elevation==null?0:x.elevation; });
          }
          (async()=>{
            const dataset='srtm30m';
            for (let i=0;i<lats.length;i+=B){
              let ok=false;
              for (let a=0;a<5 && !ok;a++){
                try{ await batch(i, dataset); ok=true; }
                catch(e){ console.log('retry',i,String(e).slice(0,80)); await sleep(3000*(a+1)); }
              }
              if(!ok){ console.log('FAILED batch at',i); process.exit(1); }
              await sleep(1200); // opentopodata: max 1 call/sec
            }
            const vals=heights.map(h=>h==null?0:h), mn=Math.min(...vals), mx=Math.max(...vals);
            console.log(JSON.stringify({lat:LAT,lon:LON,km:KM,n:N,south:S,north:Nn,west:W,east:E,min:mn,max:mx,dataset}));
            console.log('HEIGHTS:'+vals.map(h=>Math.round(h)).join(','));
          })();
          EOF
