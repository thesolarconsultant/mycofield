# One-off: fetch recent weather for a single point from Open-Meteo and print it to the log.
# Used to answer a weather question from an environment whose egress is locked. Safe: read-only, no secrets.
name: Weather check
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude'
        type: string
        default: '52.8500'
      lon:
        description: 'Longitude'
        type: string
        default: '-3.7600'
permissions:
  contents: read
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Open-Meteo
        run: |
          LAT="${{ inputs.lat }}"; LON="${{ inputs.lon }}"
          URL="https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=precipitation_sum,temperature_2m_min,temperature_2m_max,et0_fao_evapotranspiration&hourly=soil_moisture_3_to_9cm&past_days=14&forecast_days=3&timezone=Europe%2FLondon"
          echo "Point: $LAT, $LON"
          curl -sS "$URL" > w.json
          echo "Model elevation: $(jq -r '.elevation' w.json) m"
          echo ""
          echo "date        rain_mm  low_C  high_C"
          jq -r '.daily | [.time, .precipitation_sum, .temperature_2m_min, .temperature_2m_max] | transpose[] | "\(.[0])  \(.[1]//0 | (.*10|round)/10)      \(.[2]//0)    \(.[3]//0)"' w.json
          echo ""
          echo "14-day rain total (through today): $(jq -r '[.daily.precipitation_sum[0:14][]] | add | (.*10|round)/10' w.json) mm"
          echo "Latest soil moisture 3-9cm: $(jq -r '[.hourly.soil_moisture_3_to_9cm[] | select(.!=null)] | last' w.json) m3/m3"
