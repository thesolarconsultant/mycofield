<body>
<!-- Link previews (WhatsApp, Facebook, iMessage) read the tags above; people are sent straight into the app,
     which opens the shared spot for a signed-in account with access. The code is never a location. -->
<main><p>Opening MycoField…<br><a id="go" href="/">Tap here if nothing happens</a></p></main>
<script>
(function () {
  var m = location.pathname.match(/\/s\/([A-Za-z0-9]{6,16})\/?$/) || location.search.match(/[?&]c=([A-Za-z0-9]{6,16})/);
  var to = '/' + (m ? '?s=' + m[1].toLowerCase() : '');
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
